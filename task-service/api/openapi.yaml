openapi: 3.1.0
info:
  title: Task Service REST API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /workspaces:
    post:
      operationId: createWorkspace
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateWorkspace' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '400': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: getWorkspace
      parameters: [{ name: includeArchived, in: query, schema: { type: boolean, default: false } }]
      responses: { '200': { description: Workspace, content: { application/json: { schema: { $ref: '#/components/schemas/Workspace' } } } }, '403': { $ref: '#/components/responses/Error' } }
    patch:
      operationId: updateWorkspace
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, version], properties: { name: { type: string, maxLength: 100 }, version: { type: integer, minimum: 1 } } } } } }
      responses: { '200': { description: Updated }, '409': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: archiveWorkspace
      parameters: [{ $ref: '#/components/parameters/Version' }]
      responses: { '200': { description: Archived }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/transfer:
    post:
      operationId: transferWorkspaceOwnership
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [newOwnerId, version], properties: { newOwnerId: { type: string }, version: { type: integer, minimum: 1 } } } } } }
      responses: { '200': { description: Ownership transferred }, '403': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/projects:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: createProject
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProject' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } } }, '409': { $ref: '#/components/responses/Error' } }
    get:
      operationId: listProjects
      parameters: [{ name: includeArchived, in: query, schema: { type: boolean, default: false } }]
      responses: { '200': { description: Projects } }
  /workspaces/{workspaceId}/projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: projectId, in: path, required: true, schema: { type: string } }]
    get: { operationId: getProject, responses: { '200': { description: Project }, '404': { $ref: '#/components/responses/Error' } } }
    patch:
      operationId: updateProject
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateProject' } } } }
      responses: { '200': { description: Updated }, '409': { $ref: '#/components/responses/Error' } }
    delete: { operationId: archiveProject, parameters: [{ $ref: '#/components/parameters/Version' }], responses: { '200': { description: Archived } } }
  /workspaces/{workspaceId}/invitations:
    post:
      operationId: inviteWorkspaceMember
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, role], properties: { email: { type: string, format: email }, role: { $ref: '#/components/schemas/AssignableRole' } } } } } }
      responses: { '201': { description: Invitation and one-time raw token }, '429': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/invitations/{invitationId}/resend:
    post: { operationId: resendInvitation, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/InvitationId' }], responses: { '200': { description: Reissued invitation and token }, '409': { $ref: '#/components/responses/Error' } } }
  /workspaces/{workspaceId}/invitations/{invitationId}:
    delete: { operationId: revokeInvitation, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/InvitationId' }], responses: { '204': { description: Revoked }, '409': { $ref: '#/components/responses/Error' } } }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses: { '200': { description: Membership created }, '409': { $ref: '#/components/responses/Error' }, '410': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/members:
    get: { operationId: listWorkspaceMembers, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }], responses: { '200': { description: Members } } }
  /workspaces/{workspaceId}/members/{userId}:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: userId, in: path, required: true, schema: { type: string } }]
    patch:
      operationId: updateWorkspaceMember
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [role, status], properties: { role: { $ref: '#/components/schemas/AssignableRole' }, status: { type: string, enum: [active, suspended] } } } } } }
      responses: { '200': { description: Updated }, '403': { $ref: '#/components/responses/Error' } }
    delete: { operationId: removeWorkspaceMember, responses: { '204': { description: Removed; task attribution is preserved }, '403': { $ref: '#/components/responses/Error' } } }
  /workspaces/{workspaceId}/audit-events:
    get:
      operationId: listWorkspaceAuditEvents
      parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }]
      responses: { '200': { description: Immutable administrative audit events }, '403': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/tasks:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
    post:
      operationId: createTask
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateTask' } } } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }, '409': { $ref: '#/components/responses/Error' } }
    get:
      operationId: listTasks
      parameters:
        - { name: projectId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: string } }
        - { name: reporterId, in: query, schema: { type: string } }
        - { name: labelId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200, default: 50 } }
      responses: { '200': { description: Page, content: { application/json: { schema: { type: object, properties: { tasks: { type: array, items: { $ref: '#/components/schemas/Task' } }, nextCursor: { type: string } } } } } } }
  /workspaces/{workspaceId}/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getTask
      responses: { '200': { description: Task, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      operationId: updateTask
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateTask' } } } }
      responses: { '200': { description: Updated }, '409': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: archiveTask
      parameters: [{ name: version, in: query, required: true, schema: { type: integer } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '204': { description: Archived }, '409': { $ref: '#/components/responses/Error' } }
  /workspaces/{workspaceId}/tasks/{id}/restore:
    post: { operationId: restoreTask, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Restored } } }
  /workspaces/{workspaceId}/tasks/{id}/reorder:
    post: { operationId: reorderTask, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Reordered } } }
  /workspaces/{workspaceId}/tasks:batch:
    patch: { operationId: batchUpdateTasks, parameters: [{ $ref: '#/components/parameters/WorkspaceId' }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Updated atomically } } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 200 } }
    Version: { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
    InvitationId: { name: invitationId, in: path, required: true, schema: { type: string } }
  responses:
    Error: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Workspace:
      type: object
      required: [id, name, ownerId, version, createdAt, updatedAt]
      properties: { id: { type: string }, name: { type: string }, ownerId: { type: string }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time }, archivedAt: { type: [string, 'null'], format: date-time } }
    CreateWorkspace: { type: object, required: [name], properties: { name: { type: string, minLength: 1, maxLength: 100 } } }
    WorkflowStatus: { type: object, required: [key, name], properties: { key: { type: string, maxLength: 50 }, name: { type: string, maxLength: 100 } } }
    Project:
      type: object
      required: [id, workspaceId, name, key, workflow, visibility, version, createdAt, updatedAt]
      properties: { id: { type: string }, workspaceId: { type: string }, name: { type: string }, key: { type: string }, description: { type: string }, workflow: { type: array, items: { $ref: '#/components/schemas/WorkflowStatus' } }, visibility: { type: string, enum: [workspace, private] }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time }, archivedAt: { type: [string, 'null'], format: date-time } }
    CreateProject:
      type: object
      required: [name, key]
      properties: { name: { type: string, maxLength: 100 }, key: { type: string, pattern: '^[A-Z][A-Z0-9]{1,9}$' }, description: { type: string, maxLength: 2000 }, workflow: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/WorkflowStatus' } }, visibility: { type: string, enum: [workspace, private], default: workspace } }
    UpdateProject:
      type: object
      required: [name, version]
      properties: { name: { type: string, maxLength: 100 }, description: { type: string, maxLength: 2000 }, workflow: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/WorkflowStatus' } }, visibility: { type: string, enum: [workspace, private] }, version: { type: integer, minimum: 1 } }
    AssignableRole: { type: string, enum: [admin, member, viewer] }
    Task:
      type: object
      required: [id, workspaceId, projectId, title, status, priority, reporterId, position, version, createdAt, updatedAt]
      properties: { id: { type: string }, workspaceId: { type: string }, projectId: { type: string }, title: { type: string }, description: { type: string }, status: { type: string }, priority: { type: string }, assigneeId: { type: string }, reporterId: { type: string }, labelIds: { type: array, items: { type: string } }, dueDate: { type: [string, 'null'], format: date-time }, startDate: { type: [string, 'null'], format: date-time }, estimateMinutes: { type: integer }, position: { type: number }, version: { type: integer }, createdAt: { type: string, format: date-time }, updatedAt: { type: string, format: date-time } }
    CreateTask: { type: object, required: [projectId, title], properties: { projectId: { type: string }, title: { type: string, maxLength: 300 }, description: { type: string }, priority: { type: string }, assigneeId: { type: string }, labelIds: { type: array, items: { type: string } } } }
    UpdateTask: { allOf: [{ $ref: '#/components/schemas/CreateTask' }, { type: object, required: [version], properties: { status: { type: string }, version: { type: integer } } }] }
    Error: { type: object, properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, requestId: { type: string } } } } }
