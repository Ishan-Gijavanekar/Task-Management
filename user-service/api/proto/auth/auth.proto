syntax = "proto3";

package auth.v1;

option go_package = "github.com/Ishan-Gijavanekar/user-service/api/proto/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

service AuthService {
    rpc Register(RegisterRequest) returns (AuthResponse);
    rpc Login(LoginRequest) returns (AuthResponse);
}

message RegisterRequest {
    string name = 1;
    string email = 2;
    string password = 3;
}

message LoginRequest {
    string email = 1;
    string password = 2;
}

message AuthUser {
    string id = 1;
    string name = 2;
    string email = 3;
    string role = 4;
    google.protobuf.Timestamp createdAt = 5;
    google.protobuf.Timestamp updatedAt = 6;
}

message AuthResponse {
    AuthUser user = 1;
    string access_token = 5;
    int64 expires_in = 3;
    string token_type = 4;
}