name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  task-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: task-service/go.mod
          cache-dependency-path: task-service/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: docker build -t task-service:test .

  quality:
    runs-on: ubuntu-latest
    services:
      mongodb:
        # MongoDB 8 can fail at startup on runner kernels >= 6.19 (SERVER-121912).
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: user-service/go.mod
          cache-dependency-path: user-service/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: make test-cover
      - run: make coverage-check
      - name: MongoDB repository integration test
        env:
          MONGO_INTEGRATION_URI: mongodb://localhost:27017
        run: make test-integration
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --exit-code 1

      - name: Build production image
        run: docker build -t user-service:test ./user-service

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: user-service:test
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build task service image
        run: docker build -t task-service:test ./task-service

      - name: Scan task service image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: task-service:test
          severity: HIGH,CRITICAL
          exit-code: "1"
